name: Publish Dan 142 GTFS routes
on:
  push:
    paths:
      - 'tools/build_route142.py'
      - '.github/workflows/publish-route142.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract routes from official GTFS
        run: python tools/build_route142.py
      - name: Commit generated packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add driver/82/routes/outbound.json driver/82/routes/inbound.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Dan 142 approved GTFS packages'
            git push
          fi
