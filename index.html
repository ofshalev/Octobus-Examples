<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octobus · Deviation Examples</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f9; color: #172033; }
    header { padding: 12px 20px; background: #ffffff; border-bottom: 1px solid #d8dee7; }
    .title-row { display: flex; align-items: center; gap: 10px; }
    .octobus-logo { width: 46px; height: auto; display: block; flex: 0 0 auto; clip-path: inset(0 0 5px 0); margin-bottom: -5px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 3px 0 0 56px; color: #5b6472; font-size: 14px; }
    .toolbar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; padding: 14px 20px; background: #ffffff; border-bottom: 1px solid #d8dee7; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 280px; }
    label { font-size: 12px; font-weight: 700; color: #5b6472; }
    select { min-height: 38px; padding: 7px 10px; border: 1px solid #b9c2cf; border-radius: 6px; background: #ffffff; font-size: 14px; }
    #status { min-height: 38px; display: flex; align-items: center; color: #5b6472; font-size: 13px; }
    #map { height: calc(100vh - 145px); min-height: 520px; width: 100%; }
    .legend { background: rgba(255,255,255,.94); border: 1px solid #d8dee7; border-radius: 6px; padding: 8px 10px; line-height: 1.45; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .legend-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    .legend-line { width: 24px; border-top: 4px solid; }
    .ring-marker { background: transparent; border: 0; }
    .ring-marker svg { display: block; overflow: visible; }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <img class="octobus-logo" src="octobus_logo.svg" alt="Octobus">
      <h1>Octobus · Deviation Examples</h1>
    </div>
    <p>Curated GeoJSON outputs from successful deviation-planner runs.</p>
  </header>

    <div class="field">
      <label for="example-select">Saved example</label>
      <select id="example-select"></select>
    </div>
    <div id="status" role="status" aria-live="polite">Loading…</div>
  </div>
  <div id="map" aria-label="Map of the selected Octobus deviation example"></div>

      { route: "142", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_142_direction_1_approved_deviation_found.geojson" },
      { route: "146", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_146_direction_1_approved_deviation_found.geojson" },
      { route: "149", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_149_direction_1_approved_deviation_found.geojson" },
      { route: "161", direction: "0", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_161_direction_0_approved_deviation_found.geojson" },
      { route: "168", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_168_direction_1_approved_deviation_found.geojson" },
      { route: "171", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_171_direction_1_approved_deviation_found.geojson" },
      { route: "172", direction: "0", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_172_direction_0_approved_deviation_found.geojson" },
      { route: "178", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_178_direction_1_approved_deviation_found.geojson" },
      { route: "289", direction: "1", scenario: 1, generated: "Benchmark v1", file: "approved_benchmark_v1/route_289_direction_1_approved_deviation_found.geojson" }
    ];

    const stopColors = {
      original_route_stop: "#2ca02c",
      cancelled_stop: "#ff0000",
      new_stop: "#1f9ed6",
      reported_block_stop: "#ff8800",
      deviate_from_stop: "#8000ff",
      deviate_to_stop: "#8000ff"
    };

    const select = document.getElementById("example-select");
    const status = document.getElementById("status");

    function exampleLabel(example) {
      const destinationLabel = example.destination ? ` → ${example.destination}` : "";
      const scenarioLabel = example.scenario > 1 ? ` · scenario ${example.scenario}` : "";
      return `Route ${example.route}${destinationLabel}${scenarioLabel} · ${example.generated}`;
    }

    function updateExampleOption(example) {
      const option = Array.from(select.options).find(item => item.value === example.file);
      if (option) option.textContent = exampleLabel(example);
    }

    for (const example of examples) {
      const option = document.createElement("option");
      option.value = example.file;
      option.textContent = exampleLabel(example);
      select.appendChild(option);
    }

    const map = L.map("map", { zoomControl: true }).setView([32.075, 34.78], 13);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }).addTo(map);

    let currentLayer = null;

    function styleFeature(feature) {
      const properties = feature.properties || {};
      return {
        color: properties.stroke || "#0f6fff",
        weight: properties["stroke-width"] || 3,
        opacity: properties["stroke-opacity"] ?? 0.9
      };
    }

    function escapeXml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

    function pointToLayer(feature, latlng) {
      const properties = feature.properties || {};
      const color = stopColors[properties.type] || properties["marker-color"] || properties.stroke || "#0f6fff";
      const centerFill = properties["marker-fill"] || "#ffffff";
      const glyph = properties["marker-glyph"] ? escapeXml(properties["marker-glyph"]) : "";

      let centerContent;
      if (glyph) {
        centerContent = `<text x="8" y="10.6" text-anchor="middle" font-size="7" font-family="Arial, sans-serif" font-weight="700" fill="${color}">${glyph}</text>`;
      } else {
        centerContent = `<circle cx="8" cy="8" r="2.2" fill="${color}"/>`;
      }

      const html = `
        <svg width="24" height="24" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.5" fill="${centerFill}" stroke="${color}" stroke-width="3"/>
          ${centerContent}
        </svg>`;

      return L.marker(latlng, {
        icon: L.divIcon({
          className: "ring-marker",
          html,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
          popupAnchor: [0, -12]
        }),
        keyboard: false
      });
    }

    function popupContent(feature) {
      const properties = feature.properties || {};
      const stopName = properties.stop_name;
      const stopCode = properties.stop_code;

      if (stopName || stopCode) {
        const name = stopName ? escapeXml(stopName) : "";
        const code = stopCode ? escapeXml(stopCode) : "";
        return `<div dir="rtl" style="text-align:right;">${name}${name && code ? "<br>" : ""}${code}</div>`;
      }

      return "Octobus GeoJSON feature";
    }

    async function loadExample(filename) {
      status.textContent = "Loading GeoJSON…";

      try {
        const response = await fetch(filename, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const geojson = await response.json();
        const metadata = geojson.properties || geojson.metadata || {};

        if (currentLayer) map.removeLayer(currentLayer);

        currentLayer = L.geoJSON(geojson, {
          style: styleFeature,
          pointToLayer,
          onEachFeature(feature, layer) {
            layer.bindPopup(popupContent(feature));
          }
        }).addTo(map);

        const bounds = currentLayer.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [24, 24] });

        const selected = examples.find(example => example.file === filename);
        if (selected) {
          const destination = String(metadata.destination || "").trim();
          if (destination) {
            selected.destination = destination;
            updateExampleOption(selected);
          }

          status.textContent = selected.destination
            ? `Showing route ${selected.route} → ${selected.destination}`
            : `Showing route ${selected.route}`;
        } else {
          status.textContent = "GeoJSON loaded";
        }
      } catch (error) {
        console.error(error);
        status.textContent = "Could not load this GeoJSON file.";
      }
    }

    select.addEventListener("change", () => loadExample(select.value));

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <div class="legend-row"><span class="legend-line" style="border-color:#1f2a7a"></span><span>Original route</span></div>
        <div class="legend-row"><span class="legend-line" style="border-color:#00bcd4"></span><span>Deviation path</span></div>`;
      return div;
    };
    legend.addTo(map);

    loadExample(examples[0].file);
  </script>
